openapi: 3.1.0

info:
  title: AI Agent 平台 API
  version: 1.0.0
  contact:
    name: AI Agent 平台团队
    email: platform@example.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    AI Agent 平台的 HTTP API 规范，是前后端联调的**唯一事实来源**。

    关键约定（详见《架构设计文档》第六章）：
    - 除事件流接口外，所有响应使用统一信封 `{code, message, data, request_id}`
    - `code = 0` 表示成功；非 0 为五位业务错误码（AABBB：前两位模块，后三位序号）
    - 列表字段无数据时必须返回 `[]`，**禁止返回 null**
    - 时间一律 RFC3339 带时区；对外 ID 一律字符串（避免 JS Number 精度丢失）
    - 创建类接口支持 `Idempotency-Key` 请求头

servers:
  - url: https://api.example.com/api/v1
    description: 生产环境
  - url: http://localhost:8080/api/v1
    description: 本地开发

tags:
  - name: Auth
    description: 用户注册与登录
  - name: Marketplace
    description: 应用广场 — 发布、浏览、订阅
  - name: Resources
    description: 资源中心 — Tool / Skill / MCP / 知识库注册
  - name: Agents
    description: 应用中心 — Agent 定义与版本管理
  - name: Bundles
    description: 应用中心 — Bundle 编排定义
  - name: Runs
    description: 编排运行时 — 启动运行、事件流、human gate 审批
  - name: Usage
    description: 用量与成本 — 用户自己的消耗
  - name: ModelProviders
    description: 模型广场 — Provider 接入
  - name: Operations
    description: 运营中心 — 审计日志、举报处理
  - name: Plugins
    description: 插件体系 — 上传（签名校验+自动化门槛）、私有安装/卸载/更新配置
  - name: ApiKeys
    description: 系统配置 → API Key 管理 — 第三方 / 服务端调用本平台 API 用的个人凭证

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ────────────────────────── 认证 ──────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: 注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, writeOnly: true }
                display_name: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 邮箱已注册
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────── 应用广场 ──────────────────────────
  /marketplace/listings:
    get:
      tags: [Marketplace]
      summary: 广场浏览
      description: |
        返回**黑盒安全**的展示信息，绝不包含 persona、编排图等内部定义。
      operationId: browseMarketplace
      parameters:
        - name: resource_type
          in: query
          schema: { $ref: '#/components/schemas/ListingResourceType' }
        - name: q
          in: query
          description: 按名称/描述搜索
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ListingSummary' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Marketplace]
      summary: 发布资源到广场
      description: |
        发布前做**递归依赖闭包校验**：被发布资源传递依赖的每一层
        （Bundle → Agent → MCP/Skill/Tool）都必须已发布，任一层存在
        未发布的私有资源即返回 422 + 错误码 70001。

        校验按精确版本匹配——Bundle 引用的是 Agent 的具体版本，
        必须是「该版本」已发布，不是「该 Agent 有任意版本发过」。

        存在多个未发布依赖时一次性全部返回，`details` 给出完整依赖路径。
        循环依赖返回 70008。
      operationId: publishListing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_ref, version, display_meta]
              properties:
                resource_type: { $ref: '#/components/schemas/ListingResourceType' }
                resource_ref:
                  type: string
                  description: 作者空间内的资源标识
                version: { type: string, examples: ['2.0'] }
                display_meta: { $ref: '#/components/schemas/ListingDisplayMeta' }
                changelog:
                  type: string
                  description: |
                    本版本的更新说明，由作者手写。**不提供自动 diff**——
                    diff 会泄露黑盒内容。
      responses:
        '201':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListingDetail' }
        '422':
          description: 依赖完整性校验失败（70001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                privateDep:
                  value:
                    code: 70001
                    message: '该资源引用了未发布的私有资源，无法发布'
                    data: null
                    request_id: 'req-a1b2c3d4'
                    details:
                      - field: 'agents[1].capabilities.tools[2]'
                        reason: '依赖路径 web-app-builder → architect@1.0 → mcp/internal-search@1.0 未发布'
                      - field: 'agents[0]'
                        reason: '依赖路径 web-app-builder → product_manager@1.2 未发布'

  /marketplace/listings/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Marketplace]
      summary: 广场资源详情
      description: |
        黑盒资源仅返回 `display_meta` 与 `constraints_summary`。
        **`constraints_summary` 是黑盒规则的必要例外**——不暴露 persona 和
        编排图，但必须暴露执行约束，否则订阅者无法预估 Token 成本。
      operationId: getListing
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListingDetail' }
        '404':
          description: listing 不存在或已下架（70002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /marketplace/listings/{ref}/report:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Operations]
      summary: 举报该资源
      description: 提交后进入运营中心的管理员举报队列（GET /moderation/reports）。
      operationId: reportListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, examples: ['描述与实际功能严重不符'] }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: listing 不存在（70002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /marketplace/listings/{id}/unpublish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Marketplace]
      summary: 停止分发
      description: |
        停止分发后广场不再展示，但**不影响存量订阅者**（他们继续可用）。

        若该资源正被其他**已发布**资源依赖，拒绝停止分发（70007）——
        否则上游资源的依赖闭包会断裂，订阅了上游的用户会突然跑不了。
        响应的 details 列出具体依赖方。
      operationId: unpublishListing
      responses:
        '204':
          description: 已停止分发
        '409':
          description: 被其他已发布资源依赖（70007）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                depended:
                  value:
                    code: 70007
                    message: '该资源正被其他已发布资源依赖，无法停止分发'
                    data: null
                    request_id: 'req-a1b2c3d4'
                    details:
                      - field: 'depended_by'
                        reason: 'Bundle web-app-builder@2.0 正在依赖'

  /marketplace/listings/{id}/subscribe:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Marketplace]
      summary: 订阅
      description: |
        订阅关系绑定到**该 listing 的具体版本**（快照隔离）。
        作者后续发布新版本不影响本次订阅，订阅者需显式升级。
        订阅动作会把对应资源版本标记为不可变，防止作者事后修改。
      operationId: subscribeListing
      responses:
        '201':
          description: 订阅成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Subscription' }
        '404':
          description: listing 不存在或已停止分发（70002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 已订阅该版本（70004）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /marketplace/subscriptions:
    get:
      tags: [Marketplace]
      summary: 我的订阅
      operationId: listSubscriptions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Subscription' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /marketplace/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Marketplace]
      summary: 退订
      operationId: unsubscribe
      responses:
        '204':
          description: 退订成功（历史运行记录仍可查）
        '404': { $ref: '#/components/responses/NotFound' }

  /marketplace/subscriptions/{id}/upgrade:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Marketplace]
      summary: 升级订阅到新版本
      description: 显式操作，不会自动发生。升级后旧版本的运行历史仍可查。
      operationId: upgradeSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version]
              properties:
                target_version: { type: string, examples: ['2.0'] }
      responses:
        '200':
          description: 升级成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Subscription' }
        '404':
          description: 目标版本不存在（70002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── 资源中心 ──────────────────────────
  /resources:
    get:
      tags: [Resources]
      summary: 资源列表
      operationId: listResources
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Resource' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Resources]
      summary: 注册资源
      operationId: createResource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, ref, config]
              properties:
                type: { $ref: '#/components/schemas/ResourceType' }
                ref:
                  type: string
                  pattern: '^[a-z][a-z0-9_-]*$'
                  description: Agent DSL 中引用该资源使用的 ID
                  examples: ['internal-search']
                display_name: { type: string }
                config:
                  type: object
                  description: 因资源类型而异的连接配置
                  additionalProperties: true
                  examples:
                    - { endpoint: 'https://mcp.internal/search', auth_type: 'bearer' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: ref 重复（错误码 30003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Resources]
      summary: 单条资源详情
      description: |
        config 里的凭证字段照例不出现（与列表接口一致）。编辑时把这份 config
        原样交回 PATCH 即可——缺席的凭证字段会保留库里已存的值。
      operationId: getResource
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      summary: 更新资源（含启用/禁用）
      description: |
        config 采取"凭证保留"的合并语义，而不是整体替换：GET 拿到的 config
        不含凭证字段，原样存回来不会把已存的密钥清空。要换密钥就给新值，要
        清除就显式给空串。非凭证字段一律以本次提交为准，包括删除。
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                config: { type: object, additionalProperties: true }
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/skills/upload:
    post:
      tags: [Resources]
      summary: 上传 Skill zip
      description: |
        multipart/form-data：`ref`（必填）、`display_name`（可选）、`zip`（zip 文件，必须含
        `SKILL.md`）。文件逐个存入阿里云 OSS，成功后返回新建的 Skill 资源。部署未配置 OSS
        时返回 400。
      operationId: uploadSkillZip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ref, zip]
              properties:
                ref: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
                display_name: { type: string }
                zip: { type: string, format: binary }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: ref 重复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /resources/skills/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Resources]
      summary: Skill 文件树（只读）
      operationId: listSkillFiles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                path: { type: string }
                                size_bytes: { type: integer }
                                content_type: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/skills/{id}/files/{path}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: 文件相对路径，可含斜杠
    get:
      tags: [Resources]
      summary: 下载 Skill 中的单个文件
      operationId: downloadSkillFile
      responses:
        '200':
          description: 文件内容（不是 Envelope 包装，直接是文件流）
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/mcp/probe:
    post:
      tags: [Resources]
      summary: 探测 MCP Server，返回其真实工具列表
      description: |
        走真实的 MCP 协议握手（initialize + tools/list），不落库——用于注册页在保存前
        显示"这台 MCP Server 到底有哪些工具"。连接/握手失败时仍返回 200，
        `data.ok=false` 带上 `data.error`，因为"服务器拒绝了"是这个接口的正常回答之一，
        不是传输层错误。
      operationId: probeMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                headers:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value: { type: string }
      responses:
        '200':
          description: 成功（探测本身可能是 ok:false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ok]
                        properties:
                          ok: { type: boolean }
                          tools:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string }
                                description: { type: string }
                          error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /resources/components/import-openapi:
    post:
      tags: [Resources]
      summary: 解析 OpenAPI spec，返回 operation 列表（预览，不落库）
      description: |
        组件的 OpenAPI 导入是"预览 → 勾选 → 批量创建"三步：这一步只解析 spec（`spec_url`
        或直接贴 `spec_content`，二选一）并列出每个 operation，供前端勾选；真正落库是
        `POST /resources/components/batch` 的事。
      operationId: importOpenAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spec_url: { type: string }
                spec_content: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          base_url:
                            type: string
                            description: spec 的 servers[0].url，可能为空
                          operations:
                            type: array
                            items: { $ref: '#/components/schemas/OpenAPIOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /resources/components/batch:
    post:
      tags: [Resources]
      summary: 批量创建勾选的 operation（单事务）
      description: |
        每个 operation 各建一行独立的 `tools` 资源，`ref` 形如 `{base_ref}__{operation_id}`，
        `config` 存 `{component_type:"tool", tool_type:"openapi", method, path, base_url,
        import_group}`——`capabilities.tools[]` 引用其中任一 ref 时和手填的 http 型 Tool
        完全一样，Agent 层不用感知这个来源。整批在一个事务里创建，任何一个 ref 冲突都会让
        整批失败，不会留下部分创建的状态。
      operationId: batchCreateComponents
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_ref, base_url, operations]
              properties:
                base_ref: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
                base_url: { type: string }
                category:
                  type: string
                  description: 使用场景，整批共用；仅供组件广场筛选展示，运行时不读。留空则为"未分类"
                  enum: [business, lifestyle, media, productivity, education]
                operations:
                  type: array
                  items: { $ref: '#/components/schemas/OpenAPIOperation' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 批次中至少一个 ref 已存在，整批未创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── Agent ──────────────────────────
  /resources/{id}/delete-check:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Resources]
      summary: 删除前占用检查
      description: 返回该资源被哪些 Agent 引用，供前端在确认弹窗中展示影响范围
      operationId: checkResourceDeletable
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deletable: { type: boolean }
                          referenced_by:
                            type: array
                            items:
                              type: object
                              properties:
                                type: { type: string }
                                ref: { type: string }
                                version: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{id}/kb/documents:
    parameters:
      - name: id
        in: path
        required: true
        description: 一个 knowledge_base 类型资源的 id；其他类型返回 404
        schema: { type: string }
    get:
      tags: [Resources]
      summary: 已摄入的文档列表（按 source_ref 聚合，不是按 chunk）
      operationId: listKnowledgeBaseDocuments
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/KnowledgeBaseDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Resources]
      summary: 摄入一份文档（分块、向量化、存储）
      description: 用相同 source_ref 重新摄入即为更新——旧的 chunk 会先被整体替换
      operationId: ingestKnowledgeBaseDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ref, content]
              properties:
                source_ref: { type: string, description: 文档标识，如文件名或标题 }
                content: { type: string }
      responses:
        '201':
          description: 摄入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          chunk_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: embedding 调用失败或维度不匹配
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /resources/{id}/kb/documents/{source_ref}:
    delete:
      tags: [Resources]
      summary: 删除一份文档的全部 chunk
      operationId: deleteKnowledgeBaseDocument
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: source_ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{id}/kb/search:
    post:
      tags: [Resources]
      summary: 检索预览——手动验证摄入的内容能不能被合理召回
      operationId: searchKnowledgeBase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                top_k: { type: integer, default: 5 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/KnowledgeBaseSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents:
    get:
      tags: [Agents]
      summary: Agent 列表（每个 ref 返回最新启用版本）
      operationId: listAgents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Agent' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Agents]
      summary: 创建 Agent（新建或新增版本）
      description: |
        请求体中的 `definition` 会用 Agent DSL 的 JSON Schema 严格校验。
        校验失败返回 400 + 错误码 40001，`details` 中给出具体字段路径。
      operationId: createAgent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/AgentDefinition' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '400':
          description: |
            DSL 校验失败（40001）或引用了被禁用的资源（30002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                dslInvalid:
                  summary: DSL 字段不合法
                  value:
                    code: 40001
                    message: 'Agent 定义不符合 Schema'
                    data: null
                    request_id: 'req-a1b2c3d4'
                    details:
                      - field: 'model.provider'
                        reason: '必须是 anthropic / openai / google / custom 之一'

  /agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Agents]
      summary: 更新 Agent（基于最新版本创建新版本）
      description: |
        以该 Agent 的最新版本为基准创建一个新版本，definition 中的 `agent` 必须与路径中的 `ref` 一致。
        请求体中的 `definition` 会用 Agent DSL 的 JSON Schema 严格校验；保存成功后返回最新版本。
      operationId: updateAgent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/AgentDefinition' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '400':
          description: |
            DSL 校验失败（40001）、引用了被禁用的资源（30002）、或 definition.agent 与路径 ref 不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: Agent 不存在（30001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    delete:
      tags: [Agents]
      summary: 删除 Agent
      description: |
        删除前校验两类占用：
        1. 该 Agent 的任一版本已被发布且有存量订阅者 → 拒绝（快照隔离要求），只能停止分发
        2. 被其他 Bundle 引用中 → 拒绝，并在 details 列出具体 Bundle
        删除不影响历史运行记录的可查性。
      operationId: deleteAgent
      responses:
        '204':
          description: 删除成功
        '409':
          description: 存在占用无法删除（70005 已被订阅 / 40004 被引用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                inUse:
                  value:
                    code: 40004
                    message: '该 Agent 正被其他 Bundle 引用，无法删除'
                    data: null
                    request_id: 'req-a1b2c3d4'
                    details:
                      - field: 'referenced_by'
                        reason: 'Bundle web-app-builder v2.0 正在引用'

  /agents/{id}/versions:
    get:
      tags: [Agents]
      summary: 某个 Agent 的全部版本
      operationId: listAgentVersions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Agent' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────── Bundle ──────────────────────────
  /bundles:
    get:
      tags: [Bundles]
      summary: Bundle 列表
      operationId: listBundles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Bundle' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Bundles]
      summary: 创建 Bundle
      description: |
        除 JSON Schema 校验外，还会做**编排图静态校验**：
        entry 节点存在、边引用的节点均已声明、不存在因自环边被计入 join
        前置条件而永远无法触发的死锁节点。图校验失败返回 422 + 错误码 40003。
      operationId: createBundle
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/BundleDefinition' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bundle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: 图校验失败（40003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                deadlock:
                  value:
                    code: 40003
                    message: 'Bundle 编排图存在无法触发的节点'
                    data: null
                    request_id: 'req-a1b2c3d4'
                    details:
                      - field: 'orchestration.edges[3]'
                        reason: '节点 fullstack_engineer 的自环边被计入 join 前置条件，将导致该节点永远无法首次触发'

  /bundles/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Bundles]
      summary: 删除 Bundle
      description: 已被订阅的版本不可删除，只能停止分发。删除不影响历史运行记录。
      operationId: deleteBundle
      responses:
        '204':
          description: 删除成功
        '409':
          description: 已被订阅无法删除（70005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── Run ──────────────────────────
  /runs:
    get:
      tags: [Runs]
      summary: 运行列表
      operationId: listRuns
      parameters:
        - name: bundle_ref
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RunStatus' }
        - name: sort
          in: query
          description: 字段名前加 `-` 表示倒序
          schema: { type: string, default: '-created_at' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/RunSummary' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Runs]
      summary: 启动一次 Bundle 运行
      description: |
        异步启动，立即返回 run_id。前端随后连接 `/runs/{id}/stream` 消费事件流。
        强烈建议携带 `Idempotency-Key`：一次运行可能消耗大量 Token，
        网络抖动导致的重复提交是真实的成本损失。
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle_ref, input]
              properties:
                bundle_ref: { type: string, examples: ['web-app-builder'] }
                bundle_version:
                  type: string
                  description: 省略则使用最新启用版本
                  examples: ['1.0']
                input:
                  type: object
                  description: 初始需求，写入 shared_state
                  additionalProperties: true
                  examples:
                    - { requirements: '做一个待办事项 Web 应用' }
                session_id:
                  type: string
                  description: |
                    接上已有的一段对话。一段对话由多次运行组成——每发一条消息是一次运行，
                    但它们共享同一个 ADK 会话，模型因此看得到上文。留空则新开一段，
                    用哪个 id 会在响应的 `session_id` 里回传，下一条消息带回来即可续上。
                  examples: ['sess-9e67931d5c38024e']
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: 引用资源被禁用（30002）/ Agent 版本不存在（40004）/ Provider 未配置（60001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /sessions/{id}/runs:
    get:
      tags: [Runs]
      summary: 一段对话里的全部运行
      description: |
        按时间正序返回。一次运行只是一问一答，一段对话是它们串起来的那条线——
        前端刷新页面后靠这个列表重建整段对话，再按各自的 run_id 去
        `/runs/{id}/stream` 取事件。

        只返回调用者自己的运行，所以猜到别人的 session_id 也读不到别人的对话。
        没跑过任何运行的会话返回空数组而不是 404：它可能是前端刚生成、还没发出
        第一条消息的新会话。
      operationId: listSessionRuns
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          examples: { default: { value: 'sess-9e67931d5c38024e' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RunSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /runs/agent-test:
    post:
      tags: [Runs]
      summary: 试运行一个（可以尚未保存的）智能体
      description: |
        智能体工作台右侧测试面板用的接口：传完整的 Agent 定义而不是 ref，所以正在编辑、
        还没保存的配置也能直接跑。服务端把它包成一个 `single` 类型的运行，走的是和
        `POST /runs` 完全相同的依赖预检、编译、事件流——返回的也是同一个 RunSummary，
        随后照常连 `/runs/{id}/stream` 消费事件。
      operationId: createAgentTestRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/AgentDefinition' }
                input:
                  type: object
                  description: 初始输入，写入 shared_state
                  additionalProperties: true
                session_id:
                  type: string
                  description: |
                    接上已有的一段对话。一段对话由多次运行组成——每发一条消息是一次运行，
                    但它们共享同一个 ADK 会话，模型因此看得到上文。留空则新开一段，
                    用哪个 id 会在响应的 `session_id` 里回传，下一条消息带回来即可续上。
                  examples: ['sess-9e67931d5c38024e']
      responses:
        '201':
          description: 已启动
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 引用资源被禁用（30002）/ 无法编译（40004）/ Provider 未配置（60001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        examples: { run: { value: 'run-9e67931d5c38024e' } }
    get:
      tags: [Runs]
      summary: 运行详情（含最新 shared_state）
      operationId: getRun
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{id}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: after_id
        in: query
        description: 断线续传游标，只推送 id 大于该值的事件
        schema: { type: integer, format: int64 }
    get:
      tags: [Runs]
      summary: 运行事件流（NDJSON，chunked）
      description: |
        **唯一不使用统一信封的接口**，因为是流式响应。

        - `Content-Type: application/x-ndjson`，每行一个独立 JSON 事件对象
        - 建连后先补发历史事件（可用 `after_id` 续传），再进入增量推送
        - 服务端在 `bundle.finished` / `bundle.failed` 后主动关闭连接
        - 鉴权失败等**建连阶段**的错误仍用常规信封 + 对应 HTTP 状态码返回；
          连接建立后发生的错误以一条 `type: "stream.error"` 事件推送后关闭
        - 响应头必须带 `X-Accel-Buffering: no`，避免 nginx 缓冲导致伪流式
      operationId: streamRunEvents
      responses:
        '200':
          description: 事件流
          headers:
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
            Cache-Control:
              schema: { type: string, const: 'no-cache' }
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/RunEvent' }
              examples:
                nodeStarted:
                  value:
                    id: 42
                    type: 'node.started'
                    run_id: 'run-9e67931d5c38024e'
                    node: 'architect'
                    timestamp: '2026-08-20T13:10:00Z'
                    payload: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Runs]
      summary: 停止运行
      description: |
        用户主动终止一次运行，避免继续消耗 Token。停止在 5 秒内生效，
        不等待当前 Agent 执行完。已产生的产出与事件完整保留，
        **已消耗的 Token 照常计费**（无法退回）。
      operationId: cancelRun
      responses:
        '204':
          description: 已发出停止指令
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 运行已结束（50002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /runs/{id}/gate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Runs]
      summary: human gate 审批
      description: |
        **必须做审批人角色的二次校验**——具备 Bundle 查看权限不等于具备审批权限，
        这是安全边界，不能只在网关层做身份校验。
      operationId: resolveGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node, approved]
              properties:
                node: { type: string, examples: ['architect'] }
                approved: { type: boolean }
                comment:
                  type: string
                  description: 审批意见，写入审计日志
      responses:
        '204':
          description: 处理成功（无响应体，不带信封）
        '403':
          description: 非指定审批角色（50004）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: gate 已被处理（50003）或 run 已结束（50002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── 用量与成本 ──────────────────────────
  /usage/me:
    get:
      tags: [Usage]
      summary: 我的用量与成本
      description: |
        当前用户自己的消耗，与运营中心的管理员全局报表区分。
        黑盒资源的运行消耗计入**发起运行的人**（即订阅者）。
      operationId: getMyUsage
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month], default: month }
        - name: group_by
          in: query
          schema: { type: string, enum: [bundle, day], default: bundle }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────── 运营中心 ──────────────────────────
  /audit-logs:
    get:
      tags: [Operations]
      summary: 我的审计日志
      description: |
        当前用户自己发起的操作（V1 仅 human gate 审批/驳回）。
        Append-only，数据库触发器拒绝 UPDATE/DELETE（迁移 0010）。
      operationId: listMyAuditLogs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditLog' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /moderation/reports:
    get:
      tags: [Operations]
      summary: 待处理举报队列（仅管理员）
      operationId: listPendingReports
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Report' }
                          next_cursor: { type: [string, 'null'] }
                          has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非管理员（20003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /moderation/reports/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Operations]
      summary: 处理举报（仅管理员）
      description: |
        `action: takedown` 会禁用被举报资源本身（Agent/Bundle/Skill/MCP 的
        `status`），使其立即无法通过校验被新的运行引用（30002）——这是存量
        订阅者失去访问权限的方式；同时把该 listing 标记为管理员下架，
        广场不再展示。`action: dismiss` 仅关闭举报，不影响资源。
      operationId: resolveReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, takedown] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 非管理员（20003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 举报不存在（80001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 该举报已处理（80002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── 插件体系（spec-20）──────────────────────────
  /plugins/signing-key:
    post:
      tags: [Plugins]
      summary: 注册/轮换发布者签名公钥
      description: |
        发布者本地生成 Ed25519 密钥对，私钥不上传，只把公钥（32 字节，base64）注册在这里。
        上传插件包（`POST /plugins`）时用这把公钥验签；再次调用会轮换（覆盖）已注册的公钥。
      operationId: registerPluginSigningKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string, description: 'Ed25519 公钥，32 字节，base64 编码' }
      responses:
        '204':
          description: 注册成功
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugins:
    get:
      tags: [Plugins]
      summary: 我上传过的插件版本
      description: |
        只返回调用者自己发布过的每个版本；插件广场的公开市场列表（visibility=public 且
        review_status=passed）是 `GET /plugins/market`，不是这个接口。
      operationId: listMyPlugins
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Plugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Plugins]
      summary: 上传插件包（.akp）
      description: |
        multipart/form-data：`signature`（对 `zip` 原始字节 SHA-256 摘要的 Ed25519 签名，
        base64）、`zip`（.akp 包本身，spec-20 §3.1：`plugin.json` + 可选
        `plugin.wasm`/`ui/`/`assets/`/`README.md`）。plugin_id/version 从包内
        `plugin.json` 读取，不作为单独表单字段传。

        校验链路（spec-20 §5.3）：manifest 过 JSON Schema → 签名验证（未注册签名公钥则
        400/100006，验签失败 400/100003）→ 体积上限（50MiB，超出 400/100004）→
        tools/connectors/hooks 每个 entry 的导出函数名在编译后的 wasm 里实际存在
        （不存在 400/100004）。全部通过后建版本，`visibility=private`、
        `review_status=pending` —— 发布者立刻能自己安装试用，公开上架是另一个
        单独的动作（P5）。
      operationId: uploadPlugin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [signature, zip]
              properties:
                signature: { type: string, description: '对 zip 原始字节 SHA-256 摘要的 Ed25519 签名，base64' }
                zip: { type: string, format: binary }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plugin' }
        '400':
          description: |
            manifest 校验失败（100004）、签名无效（100003）、未注册签名公钥（100006）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 该 plugin_id + version 已存在（100002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /plugins/market:
    get:
      tags: [Plugins]
      summary: 组件广场"插件" Tab 的公开市场列表
      description: |
        每个 plugin_id 一行，取其 `visibility=public` 且 `review_status=passed`
        的最新版本——未上架、未审核通过、或审核被拒的版本一律不出现在这里。
      operationId: listPluginMarket
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Plugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugins/installed:
    get:
      tags: [Plugins]
      summary: 我安装过的插件
      description: 用于市场列表标出"已安装"，而不是让每个已经装过的插件仍然显示"安装"按钮。
      operationId: listInstalledPlugins
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugins/installed/tools:
    get:
      tags: [Plugins]
      summary: 我安装的插件里能引用的能力（tools[] + renderers[]）
      description: |
        把每个已安装且启用的插件版本，其 manifest 里 `extensions.tools[]` 和
        `extensions.renderers[]` 声明的每一项，解析成 `plugin:{plugin_id}/{name}`
        这样的 ref——和资源中心的 ref 走同一个 `capabilities.tools[]` 数组，Agent
        编辑器的能力选择器用这个接口列出可选项。renderers[] 也必须出现在这里：一个
        auto_render 注册只有在它的 ref 被写进某个 Agent 的 capabilities.tools[] 之后
        才会真正生效（spec-20 §4.2）——纯渲染器插件（没有任何 tools[]）如果不在这里
        列出来，就永远没有办法被引用、也就永远不会生效。
      operationId: listInstalledPluginTools
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/InstalledPluginTool' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /moderation/plugins:
    get:
      tags: [Plugins]
      summary: 插件审核队列（仅管理员）
      description: 每一行是一个申请上架（visibility=public）、尚未审核（review_status=pending）的插件版本。
      operationId: listPendingPluginReview
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Plugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非管理员（20003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /moderation/plugins/{id}/review:
    post:
      tags: [Plugins]
      summary: 审核通过/驳回一个插件版本（仅管理员）
      operationId: reviewPlugin
      parameters:
        - name: id
          in: path
          required: true
          description: 插件版本的数字行 id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean, description: 'true 通过（review_status=passed），false 驳回（review_status=rejected）' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非管理员（20003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 插件版本不存在（100001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /plugins/{id}:
    get:
      tags: [Plugins]
      summary: 插件详情（最新已启用版本）
      operationId: getPlugin
      parameters:
        - name: id
          in: path
          required: true
          description: plugin_id（反向域名式 ref，如 `acme.charts`）
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 插件不存在（100001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

    patch:
      tags: [Plugins]
      summary: 切换某个版本的可见性（private ⇄ public，spec-20 §5.4/P5）
      description: |
        注意这里的 `{id}` 和同路径 GET 用的不是同一个东西：GET 的 `{id}` 是
        plugin_id ref，这里的 `{id}` 是某个具体版本的数字行 id（`Plugin.id`
        字段）——可见性是按版本设置的，不是按 plugin_id。只有该版本的发布者
        本人能操作。切到 `public` 即进入管理员审核队列
        （`GET /moderation/plugins`），而不是立即可安装；切回 `private`
        则退出队列。
      operationId: setPluginVisibility
      parameters:
        - name: id
          in: path
          required: true
          description: 插件版本的数字行 id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { type: string, enum: [private, public] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plugin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 插件版本不存在，或不属于调用者（100001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /plugins/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        description: plugin_id
        schema: { type: string }
    post:
      tags: [Plugins]
      summary: 安装插件到自己账号
      description: |
        不指定 `version` 时安装最新版本。私有（未公开上架）插件只有发布者自己能安装，用于
        自测；公开上架的插件要求 `review_status=passed`（100003 之外的这条权限校验用
        20003 表达）。
      operationId: installPlugin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                config:
                  type: object
                  description: 插件配置/凭证，凭证字段按既有约定加密存储
                granted:
                  type: array
                  items: { type: string }
                  description: 实际授予的 requires.permissions 子集
      responses:
        '201':
          description: 安装成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 该版本尚未公开上架/审核通过，且调用者不是发布者本人（20003）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 插件版本不存在（100001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

    patch:
      tags: [Plugins]
      summary: 更新安装配置（切换版本/resolution/config/granted）
      description: 未出现在请求体里的字段保持不变（PATCH 语义，同其它上下文的 Update）。
      operationId: updatePluginInstallation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                resolution: { type: string, enum: [pinned, live] }
                config: { type: object }
                granted:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 尚未安装该插件（100005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

    delete:
      tags: [Plugins]
      summary: 卸载插件
      operationId: uninstallPlugin
      responses:
        '204':
          description: 卸载成功
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 尚未安装该插件（100005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /plugins/assets/{id}/{ver}/{path}:
    parameters:
      - name: id
        in: path
        required: true
        description: plugin_id
        schema: { type: string }
      - name: ver
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: path
        required: true
        description: 包内相对路径（renderers[].entry 或其引用的 JS/CSS，如 ui/chart.html）
        schema: { type: string }
    get:
      tags: [Plugins]
      summary: 插件前端内容下发（独立资源域，供 renderer iframe 加载）
      description: |
        故意不认证（spec-20 §4.2）：iframe 的 `src` 直接指向这个地址，不会带
        Authorization 头，和任何静态资源 CDN 的访问方式一样。{id}/{ver} 先在
        plugins 表里查实存在，再据此拿到真实的 OSS 前缀去取文件——调用方传的
        path 本身不能直接决定读哪个 OSS key。
      operationId: getPluginAsset
      security: []
      responses:
        '200':
          description: 文件内容（Content-Type 按扩展名猜测）
        '400':
          description: path 不合法（包含 ..）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: 插件版本或文件不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── 模型广场 ──────────────────────────
  /model-catalog:
    get:
      tags: [ModelProviders]
      summary: 按模态浏览的模型目录（展示数据，不是绑定契约）
      description: Agent 的 model.name 仍然是自由文本；这个目录只是给用户挑选时看的参考
      operationId: listModelCatalog
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelCatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/model-access:
    get:
      tags: [ModelProviders]
      summary: 当前账号实际可用的 Provider（自己接入的 + 管理员配置的统一凭证）
      description: |
        运行前置检查和编译器判断"有没有可用模型"时用的是同一份数据：账号自己接入的
        Provider，加上管理员在「系统配置 → 模型提供商」里配置的统一凭证（个人凭证优先）。
        `/model-providers` 只列账号自己接入的那部分，所以所有"能不能发起运行"的 UI 判断
        都应该读这个接口，否则纯靠管理员统一凭证的账号会被误判成"没有接入任何 Provider"。
        只返回 Provider 名字，不返回任何凭证内容。
      operationId: getMyModelAccess
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api-keys:
    get:
      tags: [ApiKeys]
      summary: 我的 API Key 列表
      description: |
        只列调用者自己的 key，且从不返回原文或哈希——能看到的只有名称、创建时间、
        最后一次被用于调用的时间，以及是否已吊销。
      operationId: listAPIKeys
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApiKeySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [ApiKeys]
      summary: 新建一个 API Key
      description: |
        第三方 / 脚本调用本平台 API 的凭证——发布一个应用之后，无论是接给客户的
        标准会话页面，还是对方自己接的 Open API，鉴权都走这里发的 key：
        `Authorization: ApiKey <raw_key>`，和登录态的 `Authorization: Bearer` 并行有效，
        `POST /runs` 等接口两种都认。

        `raw_key` 只在这一次响应里出现，此后任何接口都不会再回显，也无法找回——
        丢了只能吊销重开一个。
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: ['第三方系统集成'] }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 名称为空，或已达到可创建数量上限（10001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api-keys/{id}:
    delete:
      tags: [ApiKeys]
      summary: 吊销一个 API Key
      description: |
        立即失效，不可撤回——和 GitHub/Stripe 的个人访问令牌一个模型，key 一旦
        流出这个进程（写进了脚本、粘进了 CI 的 secret），撤销开关本身救不回泄漏，
        只能让它作废。
      operationId: revokeAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 不存在 / 不是你的 / 已经吊销过（20007）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /model-providers:
    get:
      tags: [ModelProviders]
      summary: 已接入的 Provider 列表（不返回凭证）
      operationId: listModelProviders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelProvider' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [ModelProviders]
      summary: 接入 Provider
      operationId: createModelProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, api_key]
              properties:
                provider: { $ref: '#/components/schemas/ProviderName' }
                api_key:
                  type: string
                  description: 加密存储，任何接口都不回显
                  writeOnly: true
                base_url:
                  type: string
                  description: 自定义调用地址；provider 为 custom 时必填，其余 provider 缺省时使用官方地址
      responses:
        '201':
          description: 接入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelProvider' }
        '422':
          description: 凭证无效（60002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ─────────────────── 系统配置 → 模型提供商（管理员）───────────────────
  /model-catalog/providers:
    get:
      tags: [ModelCatalogAdmin]
      summary: 目录 Provider 列表（含禁用），管理员
      operationId: listCatalogProviders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ModelCatalogAdmin]
      summary: 新增模型提供商，管理员
      description: >-
        建出来的提供商同时也是一个可调用的渠道：必须挑一个协议模板
        （GET /model-channel-templates），后端据此渲染渠道描述符、完整校验并
        跑一遍回归用例，过不了就不落库。创建成功后渠道立刻可用，不需要重启。
      operationId: createCatalogProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, display_name, template]
              properties:
                key: { $ref: '#/components/schemas/ProviderName' }
                display_name: { type: string, examples: ['我的 DeepSeek'] }
                template:
                  type: string
                  description: 协议模板 id，见 GET /model-channel-templates
                  examples: ['deepseek']
                icon: { type: string, description: 'lobehub 图标名（如 kimi、zhipu）、http(s) URL 或 data: URI' }
                base_url:
                  type: string
                  description: 留空沿用模板默认地址；模板没有默认地址时必填
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CatalogProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: provider key 已存在（60007）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /model-catalog/providers/{id}:
    patch:
      tags: [ModelCatalogAdmin]
      summary: 启用/禁用 Provider，管理员
      operationId: updateCatalogProviderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: provider 不存在（60005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    delete:
      tags: [ModelCatalogAdmin]
      summary: 删除 Provider（级联删除其下所有 Model），管理员
      operationId: deleteCatalogProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: provider 不存在（60005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /model-catalog/providers/{id}/credential:
    put:
      tags: [ModelCatalogAdmin]
      summary: 设置 Provider 的管理员统一凭证（api_key + base_url），管理员
      description: >-
        组织级默认凭证：某个用户在 /models（模型广场）没有为该 provider 配置
        个人凭证时，运行时会退回到这里登记的 api_key + base_url。api_key
        留空表示不修改已保存的密钥（用于只更新 base_url 的场景）；密钥永远
        只加密存储，任何 GET 都不会把明文返回，只能通过 has_credential 得知
        是否已配置。
      operationId: setCatalogProviderCredential
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                api_key: { type: string, description: '留空则不修改已保存的密钥' }
                base_url: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: provider 不存在（60005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /model-catalog/providers/{id}/models:
    get:
      tags: [ModelCatalogAdmin]
      summary: 某 Provider 下的 Model 列表（含禁用），管理员
      operationId: listCatalogModels
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogModel' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ModelCatalogAdmin]
      summary: 在 Provider 下新增 Model（如 deepseek-v3），管理员
      operationId: createCatalogModel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, display_name, modality]
              properties:
                model: { type: string, examples: ['deepseek-v3'] }
                display_name: { type: string }
                description: { type: string }
                modality: { $ref: '#/components/schemas/CatalogModality' }
                featured: { type: boolean }
                params:
                  type: object
                  description: 模型级请求参数取值；线协议必填的参数（如 Anthropic 的 max_tokens）在这一步收齐，缺失返回 422
                  additionalProperties: { type: number }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CatalogModel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: provider 不存在（60005）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: 该 provider 下已存在同名模型（60007）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /model-catalog/providers/{id}/models/{model_id}:
    patch:
      tags: [ModelCatalogAdmin]
      summary: 启用/禁用 Model 或更新其请求参数，管理员
      operationId: updateCatalogModel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: model_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: status 和 params 各自独立更新，带哪个改哪个
              properties:
                status: { $ref: '#/components/schemas/Status' }
                params:
                  type: object
                  description: 整体替换该模型的参数取值；传空对象表示清掉全部参数（清掉必填参数会被 422 拦下）
                  additionalProperties: { type: number }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [ModelCatalogAdmin]
      summary: 删除 Model，管理员
      operationId: deleteCatalogModel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: model_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────── 功能开关 ──────────────────────────
  /features:
    get:
      tags: [Features]
      summary: 服务端功能开关（前端据此隐藏未启用的功能，如知识库）
      operationId: getFeatures
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [knowledge_base_enabled, skill_upload_enabled]
                        properties:
                          knowledge_base_enabled:
                            type: boolean
                            description: KB_ENABLED — 知识库依赖 Milvus + Elasticsearch，未部署时关闭
                          skill_upload_enabled:
                            type: boolean
                            description: OSS_* 是否已配置 — Skill zip 上传依赖对象存储，未配置时前端灰显上传入口
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────── 系统配置 → 用户管理 / 角色权限（RBAC）───────────────
  /me/permissions:
    get:
      tags: [RBAC]
      summary: 当前登录用户拥有的权限（前端按钮级别显隐的依据）
      operationId: getMyPermissions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [is_admin, permissions]
                        properties:
                          is_admin: { type: boolean }
                          permissions:
                            type: array
                            items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /permissions:
    get:
      tags: [RBAC]
      summary: 权限目录（固定，只读），管理员
      operationId: listPermissions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Permission' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /roles:
    get:
      tags: [RBAC]
      summary: 角色列表，管理员
      operationId: listRoles
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [RBAC]
      summary: 新增角色并指定权限，管理员
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { type: string, examples: ['operator'] }
                name: { type: string, examples: ['运营'] }
                description: { type: string }
                permission_keys:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 角色 key 已存在（90002）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /roles/{id}:
    delete:
      tags: [RBAC]
      summary: 删除角色，管理员
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 角色不存在（90001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /roles/{id}/permissions:
    patch:
      tags: [RBAC]
      summary: 替换角色的权限集合，管理员
      operationId: updateRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_keys]
              properties:
                permission_keys:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 角色不存在（90001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /users:
    get:
      tags: [RBAC]
      summary: 用户列表，管理员
      operationId: listUsers
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: 按邮箱或显示名模糊匹配
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/status:
    patch:
      tags: [RBAC]
      summary: 启用/停用用户，管理员
      operationId: updateUserStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: 不能停用自己的账号（10001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /users/{id}/roles:
    patch:
      tags: [RBAC]
      summary: 替换用户的角色分配，管理员
      operationId: updateUserRoles
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────── Skill 源 ──────────────────────────
  # 系统配置 → Skill 源：管理员登记公开 Skill 市场（如 https://clawhub.ai/），
  # 同步后的公开 Skill 出现在 Skill 管理 → 市场视图（GET /skill-market）。
  /model-channel-templates:
    get:
      tags: [ModelProviders]
      summary: 可选的协议模板
      description: >-
        新建模型提供商时挑一个模板。模板是一份写好了某家厂商线协议怎么调的
        渠道描述符骨架——管理员只需要填 key、显示名和接口地址，不用懂描述符
        本身。实例化出来的描述符是快照，以后模板改了不影响已建好的提供商。
      operationId: listModelChannelTemplates
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ModelChannelTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /model-provider-specs:
    get:
      tags: [ModelProviders]
      summary: 平台支持的模型渠道及其凭据字段
      description: >-
        来源是后端的渠道注册表（内置的声明式渠道描述符 + 少数手写 client）。
        前端据此渲染"新增模型提供商"的表单和显示名，不要在前端再抄一份渠道
        列表。响应里只有渠道的形状，没有任何凭据值。
      operationId: listModelProviderSpecs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ModelProviderSpec' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /skill-sources/skills:
    get:
      tags: [SkillSources]
      summary: 审核台：同步进来的全部 Skill 条目，管理员
      description: >-
        和 /skill-market 的区别：这里不过滤审核状态、也不过滤源是否停用，
        管理员要看得到"同步进来了什么"才能审。分页、搜索都在库里做——一个
        公开源同步下来动辄成百上千条。counts 是三种状态的条目数（传了
        source_id 就按该源统计），供页面顶部的筛选标签直接用；total 是当
        前筛选条件下的总数，供前端算总页数。
      operationId: listSkillsForReview
      parameters:
        - name: review_status
          in: query
          schema: { $ref: '#/components/schemas/SkillReviewStatus' }
        - name: source_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: 在 slug / 名称 / 简介里做不区分大小写的模糊匹配
          schema: { type: string }
        - name: page
          in: query
          description: 从 1 开始
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, counts, total, page, page_size, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MarketSkill' }
                          total:
                            type: integer
                            format: int64
                            description: 当前筛选条件下的条目总数
                          page: { type: integer }
                          page_size: { type: integer }
                          has_more: { type: boolean }
                          counts:
                            type: object
                            required: [pending, approved, rejected]
                            properties:
                              pending: { type: integer, format: int64 }
                              approved: { type: integer, format: int64 }
                              rejected: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /skill-sources/skills/review:
    post:
      tags: [SkillSources]
      summary: 批量审核同步条目，管理员
      description: >-
        整批用同一个结论——"通过这一批"和"驳回这一批"是两个动作。批量是主
        路径而非附加优化：一个公开源同步下来动辄成百上千条，逐条点审不完。
      operationId: reviewMarketSkills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, status]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [source_id, slug]
                    properties:
                      source_id: { type: integer, format: int64 }
                      slug: { type: string }
                status: { $ref: '#/components/schemas/SkillReviewStatus' }
                note: { type: string, description: 驳回理由等，会展示在审核台 }
      responses:
        '200':
          description: 已审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reviewed]
                        properties:
                          reviewed: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /skill-sources:
    get:
      tags: [SkillSources]
      summary: 源列表，管理员
      operationId: listSkillSources
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SkillSource' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SkillSources]
      summary: 登记一个源，管理员
      operationId: createSkillSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_url]
              properties:
                name: { type: string, maxLength: 64 }
                base_url: { type: string, format: uri }
      responses:
        '201':
          description: 登记成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 源地址已登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /skill-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [SkillSources]
      summary: 删除源（连同缓存条目），管理员
      operationId: deleteSkillSource
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /skill-sources/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [SkillSources]
      summary: 手动同步一个源，管理员
      description: |
        拉取上游全量列表并整体替换本地缓存；失败写进 last_sync_error 返回。
      operationId: syncSkillSource
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillSource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: 上游不可达（last_sync_error 里带原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /skill-market:
    get:
      tags: [SkillSources]
      summary: 所有启用源的公开 Skill（缓存快照）
      operationId: listSkillMarket
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MarketSkill' }
                          has_more: { type: boolean }

  /skill-market/{source_id}/{slug}:
    parameters:
      - name: source_id
        in: path
        required: true
        schema: { type: string }
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [SkillSources]
      summary: 公开 Skill 详情（回源补用法/作者/版本历史）
      description: |
        缓存快照打底，尽力回源补全：usage（SKILL.md 原文）、owner、
        upstream_url、versions。上游临时不可达时这些字段缺省，不报错。
      operationId: getSkillMarketDetail
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarketSkillDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /skill-market/{source_id}/{slug}/install:
    parameters:
      - name: source_id
        in: path
        required: true
        schema: { type: string }
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [SkillSources]
      summary: 把市场 Skill 安装到当前账号
      description: |
        回源下载该 Skill 的 zip 安装包，走与 zip 上传相同的校验与存储管线，
        落成本账号的一个 Skill 资源；config.installed_from 记录安装来源，
        "我的 Skill" 列表据此显示"市场安装"标记。重复安装返回 409。
      operationId: installSkillMarketSkill
      responses:
        '201':
          description: 安装成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已安装过（或 ref 已被占用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '502':
          description: 上游下载失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ────────────────────────── MCP 源 ──────────────────────────
  # 系统配置 → MCP 源：管理员登记公开 MCP 注册中心（如官方
  # https://registry.modelcontextprotocol.io），同步后过审的 Server 出现在
  # MCP 管理 → 市场视图（GET /mcp-market），可一键接入成本账号的 MCP 资源。
  #
  # 条目一律按行 id 寻址而不是 slug：上游限定名形如
  # io.github.owner/server，带点和斜杠，做不了 URL 路径参数。
  /mcp-sources/servers:
    get:
      tags: [MCPSources]
      summary: 审核台：同步进来的全部 MCP 条目，管理员
      description: >-
        和 /mcp-market 的区别：这里不过滤审核状态、也不过滤源是否停用，管理
        员要看得到"同步进来了什么"才能审。分页、搜索都在库里做——一个公开注
        册中心同步下来动辄上千条。counts 是三种状态的条目数（传了 source_id
        就按该源统计），供页面顶部的筛选标签直接用；total 是当前筛选条件下
        的总数，供前端算总页数。
      operationId: listMCPServersForReview
      parameters:
        - name: review_status
          in: query
          schema: { $ref: '#/components/schemas/SkillReviewStatus' }
        - name: source_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: 在 slug / 名称 / 简介里做不区分大小写的模糊匹配
          schema: { type: string }
        - name: page
          in: query
          description: 从 1 开始
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, counts, total, page, page_size, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MarketMCPServer' }
                          total:
                            type: integer
                            format: int64
                            description: 当前筛选条件下的条目总数
                          page: { type: integer }
                          page_size: { type: integer }
                          has_more: { type: boolean }
                          counts:
                            type: object
                            required: [pending, approved, rejected]
                            properties:
                              pending: { type: integer, format: int64 }
                              approved: { type: integer, format: int64 }
                              rejected: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mcp-sources/servers/review:
    post:
      tags: [MCPSources]
      summary: 批量审核同步条目，管理员
      description: >-
        整批用同一个结论——"通过这一批"和"驳回这一批"是两个动作。批量是主路
        径而非附加优化：一个公开注册中心同步下来动辄上千条，逐条点审不完。
      operationId: reviewMarketMCPServers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
                status: { $ref: '#/components/schemas/SkillReviewStatus' }
                note: { type: string, description: 驳回理由等，会展示在审核台 }
      responses:
        '200':
          description: 已审核
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reviewed]
                        properties:
                          reviewed: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mcp-source-protocols:
    get:
      tags: [MCPSources]
      summary: 本部署认识的 MCP 源协议
      description: >-
        新建源时挑一个协议。MCP 生态收敛出了一份公共的注册中心接口约定，官方
        和各家子注册中心说的是同一套（mcp-registry），差别只在版本前缀，所以
        它们共用一个协议、靠 api_prefix 区分；自成一套的（如 Smithery）才各有
        一个协议。前端按这份清单渲染预设与表单，不要在前端再抄一份协议列表。
      operationId: listMCPSourceProtocols
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MCPSourceProtocol' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mcp-sources:
    get:
      tags: [MCPSources]
      summary: 源列表，管理员
      operationId: listMCPSources
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MCPSource' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MCPSources]
      summary: 登记一个源，管理员
      operationId: createMCPSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_url]
              properties:
                name: { type: string, maxLength: 64 }
                base_url:
                  type: string
                  format: uri
                  description: 站点根地址，不带路径；版本前缀走 api_prefix
                protocol:
                  $ref: '#/components/schemas/MCPSourceProtocolID'
                api_prefix:
                  type: string
                  description: >-
                    接口版本前缀（如 /v0、/v0.1）。留空走该协议的默认值。
                  example: '/v0'
                api_key:
                  type: string
                  description: >-
                    该源要求的 API Key（见协议的 requires_api_key）。加密落库，
                    任何响应都不会带出来；要求密钥的协议不填则拒绝登记——建出
                    来也只会是一个一同步就 401 的空源。
      responses:
        '201':
          description: 登记成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MCPSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 源地址已登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [MCPSources]
      summary: 删除源（连同缓存条目），管理员
      description: |
        只清缓存。已经接入成本地 MCP 资源的条目不受影响——那是用户自己的资
        源，不是这个源的副本。
      operationId: deleteMCPSource
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mcp-sources/{id}/api-key:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [MCPSources]
      summary: 更换该源的 API Key，管理员
      description: |
        单独一个动作而不是删掉重建：重建会把这个源下面所有条目的审核结论一起
        丢掉。密钥加密落库，不会出现在任何响应里。
      operationId: setMCPSourceAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        '204': { description: 已更新 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mcp-sources/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [MCPSources]
      summary: 手动同步一个源，管理员
      description: |
        按 MCP Registry 协议（GET /v0/servers，游标翻页）拉取上游全量列表并
        整体替换本地缓存；失败写进 last_sync_error 返回。审核结论不会被同步
        重置。
      operationId: syncMCPSource
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MCPSource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: 上游不可达（last_sync_error 里带原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-market:
    get:
      tags: [MCPSources]
      summary: 所有启用源里过审的公开 MCP Server（缓存快照）
      operationId: listMCPMarket
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, has_more]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MarketMCPServer' }
                          has_more: { type: boolean }

  /mcp-market/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [MCPSources]
      summary: 市场条目详情
      operationId: getMCPMarketDetail
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarketMCPServer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mcp-market/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [MCPSources]
      summary: 把市场里的 MCP Server 接入当前账号
      description: |
        按快照里的远端地址建一条本账号的 mcp 资源，走与手工接入完全相同的
        管线（连通性探测、凭据加密、ref 校验）；config.installed_from 记录
        来源。只提供本地运行包、没有远端地址的条目接入不了，返回 400。重复
        接入返回 409。
      operationId: installMCPMarketServer
      responses:
        '201':
          description: 接入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Resource' }
        '400':
          description: 参数不合法，或这个条目没有远端地址、平台接入不了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已接入过（或 ref 已被占用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Web 控制台用户会话，有效期 2h
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 服务端调用 / CI 集成，格式 `ApiKey <key>`

  parameters:
    Limit:
      name: limit
      in: query
      description: 默认 20，上限 100，超出按上限截断而非报错
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      description: 游标分页令牌，来自上一页响应的 next_cursor
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 客户端生成的 UUID，24h 内相同 Key 重复请求直接返回首次结果
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 请求参数格式错误或 Schema 校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: 未认证（20001 / 20002）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Forbidden:
      description: 已认证但无权限（20003）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    # ── API Key ──
    ApiKeySummary:
      type: object
      required: [id, name, revoked, created_at]
      properties:
        id: { type: integer }
        name: { type: string, examples: ['第三方系统集成'] }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked: { type: boolean }
        created_at: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKeySummary'
        - type: object
          required: [raw_key]
          properties:
            raw_key:
              type: string
              description: 只在这一次响应里出现，此后任何接口都不会再回显
              examples: ['agk_9f3c1b6e2a7d4f0891c2b3a4d5e6f708']

    # ── 通用信封 ──
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          description: 0 为成功；非 0 为五位业务错误码
          examples: [0]
        message: { type: string, examples: ['ok'] }
        data:
          description: 业务数据，无返回内容时为 null
        request_id:
          type: string
          description: 全链路追踪 ID，等同 OTel trace_id
          examples: ['req-a1b2c3d4']
        details:
          type: array
          description: 字段级错误，表单场景使用
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason: { type: string }

    Status:
      type: integer
      description: 1 启用 / 2 停用
      enum: [1, 2]

    ResourceType:
      type: string
      enum: [tool, skill, mcp, knowledge_base, memory]

    ModelChannelTemplate:
      type: object
      required: [id, label, wire, capabilities, credentials]
      properties:
        id: { type: string, description: 模板 id，创建提供商时回传 }
        label: { type: string }
        description: { type: string }
        wire: { type: string, description: 线协议族标识，同族模板共用一套回归用例 }
        base_url:
          type: string
          description: 模板的默认接口地址；为空表示必须自己填（如 openai-compatible）
        capabilities:
          type: array
          items: { type: string, enum: [text, tools, stream, embed] }
        credentials:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string, enum: [secret, text, url] }
              label: { type: string }
              required: { type: boolean }
        request_params:
          type: array
          description: 这个线协议的 complete 请求要收的模型级参数，添加模型表单按它渲染
          items: { $ref: '#/components/schemas/ModelRequestParam' }

    ModelRequestParam:
      type: object
      description: >-
        线协议声明的模型级请求参数（形状）。取值存在每个模型上（CatalogModel.params），
        调用时由网关注入。保留名 max_tokens / temperature 直接映射到请求字段，
        其它名字作为渠道私有参数进入请求体。
      required: [name, type, required]
      properties:
        name: { type: string, examples: ['max_tokens'] }
        label: { type: string, examples: ['最大输出 tokens'] }
        type: { type: string, enum: [int, number] }
        required:
          type: boolean
          description: 线协议必填（如 Anthropic Messages 的 max_tokens）；没配的调用在发出前就会被拦下
        min: { type: number }
        max: { type: number }
        default:
          type: number
          description: 仅作添加模型表单的预填值，可改；运行时不做静默兜底
        help: { type: string }

    ModelProviderSpec:
      type: object
      required: [name, label, credentials]
      properties:
        name: { $ref: '#/components/schemas/ProviderName' }
        label: { type: string, description: 给人看的渠道名 }
        default_base_url:
          type: string
          description: 留空表示这个渠道没有默认地址（如 custom），登记时必须自己填
        credentials:
          type: array
          items:
            type: object
            required: [name, type, label, required]
            properties:
              name: { type: string }
              type: { type: string, enum: [secret, text, url] }
              label: { type: string }
              required: { type: boolean }

    ProviderName:
      type: string
      description: >-
        模型提供商（= 可调用的渠道）的 key，由管理员在 系统配置 → 模型提供商
        里从协议模板创建。不是固定枚举：平台开箱不带任何渠道，有哪些取决于
        这个部署配了什么。可选值见 GET /model-provider-specs。
      pattern: '^[a-z][a-z0-9_-]{0,31}$'

    RunStatus:
      type: string
      enum: [running, finished, failed]

    Resource:
      type: object
      required: [id, type, ref, status, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ResourceType' }
        ref: { type: string }
        display_name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: 凭证字段不出现在这里（见 credential_keys）
        credential_keys:
          type: array
          items: { type: string }
          description: >-
            这个资源有哪几个凭证字段的**名字**，值一概不返回。编辑界面据此渲
            染换密钥的输入框：留空表示不改，给新值表示替换，给空串表示清除。
        status: { $ref: '#/components/schemas/Status' }
        health:
          type: string
          description: MCP Server 等外部资源的健康状态
          enum: [unknown, healthy, unhealthy]
        created_at: { type: string, format: date-time }

    OpenAPIOperation:
      type: object
      required: [operation_id, method, path]
      properties:
        operation_id:
          type: string
          description: 已消毒为 ref 安全片段（小写字母数字下划线），不一定是 spec 原始 operationId
        method: { type: string, examples: ['GET'] }
        path: { type: string, examples: ['/pets/{id}'] }
        summary: { type: string }

    # ── Agent DSL（与 schemas/agent.schema.json 保持一致）──
    AgentDefinition:
      type: object
      required: [agent, role, version, model, persona, capabilities, constraints]
      properties:
        agent:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          examples: ['architect']
        role: { type: string, examples: ['系统架构师'] }
        version: { type: string, pattern: '^\d+\.\d+(\.\d+)?$' }
        model:
          type: object
          required: [provider, name]
          properties:
            provider: { $ref: '#/components/schemas/ProviderName' }
            name: { type: string, examples: ['claude-sonnet-5'] }
            fallback:
              type: array
              description: 主模型不可用时按顺序降级，格式 provider/name
              items: { type: string, pattern: '^[a-z]+/.+$' }
            temperature: { type: number, minimum: 0, maximum: 2 }
        persona:
          type: string
          description: 角色设定，支持模板变量如 {{shared_state.requirements}}
        capabilities:
          type: object
          properties:
            tools:
              type: array
              items: { type: string }
            skills:
              type: array
              items: { type: string }
            builtin_tools:
              type: array
              description: ADK 自带工具，不经过资源中心登记
              items:
                type: string
                enum: [google_search, load_memory, preload_memory, load_artifacts, exit_loop]
            hooks:
              type: object
              properties:
                before_tool_call: { type: array, items: { type: string } }
                after_tool_call: { type: array, items: { type: string } }
                before_response: { type: array, items: { type: string } }
                after_response: { type: array, items: { type: string } }
                on_error: { type: array, items: { type: string } }
        constraints:
          type: object
          properties:
            max_tokens_per_turn: { type: integer, minimum: 1 }
            max_tool_calls: { type: integer, minimum: 0 }
            max_turns: { type: integer, minimum: 1 }
            timeout_seconds: { type: integer, minimum: 1 }
            forbidden_actions:
              type: array
              items: { type: string }
            output_schema:
              type: string
              description: 该 Agent 产出必须满足的 JSON Schema 引用
        handoff:
          type: object
          properties:
            accepts_input_from: { type: array, items: { type: string } }
            produces_output_to: { type: array, items: { type: string } }
            requires_review: { type: boolean }

    Agent:
      type: object
      required: [id, agent_ref, version, definition, status, created_at]
      properties:
        id: { type: string }
        agent_ref: { type: string }
        version: { type: string }
        definition: { $ref: '#/components/schemas/AgentDefinition' }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }

    # ── Bundle DSL（与 schemas/bundle.schema.json 保持一致）──
    BundleDefinition:
      type: object
      required: [bundle, version, agents]
      properties:
        type:
          type: string
          description: >-
            运行类型，决定编排引擎如何调度：graph（默认，省略即此）走完整图执行引擎；flow 按 agents[]
            声明顺序严格串行执行，走 ADK 原生 SequentialAgent，无需 orchestration；single 只有一个
            agent，直接运行。省略时按 graph 处理，此时 orchestration 必填。
          enum: [graph, flow, single]
          default: graph
        bundle: { type: string, pattern: '^[a-z][a-z0-9-]*$' }
        version: { type: string, pattern: '^\d+\.\d+(\.\d+)?$' }
        description: { type: string }
        agents:
          type: array
          minItems: 1
          items:
            type: object
            required: [ref]
            properties:
              ref: { type: string }
              alias:
                type: string
                description: 同一 Agent 在一个 Bundle 中多次出现时用于区分
              version: { type: string }
        orchestration:
          type: object
          required: [mode, entry, edges]
          properties:
            mode:
              type: string
              enum: [pipeline, graph]
            entry: { type: string }
            edges:
              type: array
              minItems: 1
              items:
                type: object
                required: [from, to]
                properties:
                  from: { type: string }
                  to:
                    description: 单个目标、多个目标（并行 fan-out），或字面量 END
                    oneOf:
                      - type: string
                      - type: array
                        items: { type: string }
                        minItems: 2
                  mode:
                    type: string
                    enum: [sequential, parallel]
                  join:
                    type: string
                    enum: [wait_all, wait_any]
                  condition:
                    type: string
                    description: 基于 shared_state 的路由表达式（expr-lang 语法）
                    examples: ['shared_state.tests_passed == true']
            human_gates:
              type: array
              items:
                type: object
                required: [after]
                properties:
                  after: { type: string }
                  timeout_seconds: { type: integer, minimum: 1 }
                  on_timeout:
                    type: string
                    enum: [auto_approve, auto_reject, abort]
                  approver_roles:
                    type: array
                    description: 有资格审批的角色，为空则回退到团队默认审批角色
                    items: { type: string }
        limits:
          type: object
          properties:
            max_total_tokens: { type: integer, minimum: 1 }
            max_wall_clock_seconds: { type: integer, minimum: 1 }
            max_cost_usd: { type: number, minimum: 0 }

    Bundle:
      type: object
      required: [id, bundle_ref, version, definition, status, created_at]
      properties:
        id: { type: string }
        bundle_ref: { type: string }
        version: { type: string }
        definition: { $ref: '#/components/schemas/BundleDefinition' }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }

    # ── Run ──
    RunSummary:
      type: object
      required: [run_id, bundle_ref, status, created_at]
      properties:
        run_id: { type: string, examples: ['run-9e67931d5c38024e'] }
        session_id:
          type: string
          description: 这次运行所属的那段对话；把它带回下一次 POST 就能续上上下文。历史运行可能没有。
          examples: ['sess-9e67931d5c38024e']
        bundle_ref: { type: string }
        bundle_version: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [shared_state, is_owner]
          properties:
            shared_state:
              type: object
              description: |
                跨 Agent 共享的结构化上下文。当 `is_owner` 为 false（订阅者
                查看黑盒资源）时，仅包含该资源 display_meta.io_description.outputs
                声明的字段。
              additionalProperties: true
            is_owner:
              type: boolean
              description: |
                当前请求者是否为该运行所用 Bundle 的作者本人。为 false 时前端
                进入黑盒降级展示：执行图只显示占位节点，共享状态与事件流已由
                后端过滤为声明的输出子集。
            usage:
              type: object
              description: 本次运行的资源消耗，用于 Chat 页右侧栏展示
              properties:
                total_tokens: { type: integer }
                cost_usd: { type: number }
                duration_seconds: { type: integer }

    RunEvent:
      type: object
      required: [id, type, run_id, timestamp]
      description: |
        事件流中的单条事件。前端 Chat 界面据此驱动：
        `node.thinking` → 打字机效果；`node.tool_call.*` → 气泡内工具调用状态条；
        `human_gate.waiting` → 内联审批卡片；`node.render`（spec-20 §4.2）→
        插件渲染 iframe 卡片，payload 带 `plugin`/`version`/`renderer`/
        `resource_uri`/`entry`/`data`。
      properties:
        id:
          type: integer
          format: int64
          description: 自增主键，作为断线续传游标
        type:
          type: string
          enum:
            - bundle.started
            - bundle.finished
            - bundle.failed
            - node.queued
            - node.started
            - node.thinking
            - node.tool_call.started
            - node.tool_call.finished
            - node.finished
            - node.failed
            - node.render
            - human_gate.waiting
            - human_gate.resolved
            - shared_state.updated
            - stream.error
        run_id: { type: string }
        node:
          type: string
          description: 事件关联的节点（bundle 级事件为空）
        timestamp: { type: string, format: date-time }
        payload:
          description: 因事件类型而异

    # ── 用户与认证 ──
    AuthResult:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string, description: 'JWT，有效期 2h' }
        refresh_token: { type: string, description: '有效期 7d' }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        is_admin:
          type: boolean
          description: 是否拥有运营中心的管理员权限（举报处理）。V1 无角色系统，仅此一个布尔位。
          default: false
        created_at: { type: string, format: date-time }

    # ── 广场与订阅 ──
    ListingResourceType:
      type: string
      enum: [agent, bundle, skill, mcp]

    ListingDisplayMeta:
      type: object
      description: |
        **可公开展示**的元信息，与资源的 definition 分离存储。
        黑盒发布下，订阅者只能看到本对象的内容。
      required: [display_name, description]
      properties:
        display_name: { type: string, examples: ['全栈应用生成器'] }
        description: { type: string }
        usage:
          type: string
          description: 使用说明（怎么用、注意什么）
        io_description:
          type: object
          description: 输入输出说明；黑盒运行时，共享状态面板只展示此处声明的输出字段
          properties:
            input: { type: string }
            outputs:
              type: array
              items: { type: string }
              examples: [['requirements', 'architecture_doc', 'ui_spec', 'code_diff']]

    ConstraintsSummary:
      type: object
      description: |
        执行约束摘要。黑盒规则的**必要例外**：不暴露内部定义，
        但必须让订阅者能预估运行成本。
      properties:
        max_tool_calls: { type: integer }
        timeout_seconds: { type: integer }
        estimated_tokens_range:
          type: string
          examples: ['30000~60000']

    ListingSummary:
      type: object
      required: [id, listing_ref, resource_type, version, display_meta, author, subscriber_count]
      properties:
        id: { type: string }
        listing_ref:
          type: string
          description: 广场内的稳定标识，跨版本不变
        resource_type: { $ref: '#/components/schemas/ListingResourceType' }
        version: { type: string }
        visibility:
          type: string
          enum: [blackbox]
          description: V1 仅支持 blackbox；public 模式见 PRD P2-4
        display_meta: { $ref: '#/components/schemas/ListingDisplayMeta' }
        author: { $ref: '#/components/schemas/User' }
        subscriber_count: { type: integer }
        run_count: { type: integer }
        subscribed:
          type: boolean
          description: 当前用户是否已订阅（用于广场卡片显示"进入使用"）
        published_at: { type: string, format: date-time }

    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/ListingSummary'
        - type: object
          properties:
            constraints_summary: { $ref: '#/components/schemas/ConstraintsSummary' }
            versions:
              type: array
              description: 版本历史，只含作者手写的 changelog，不含 diff
              items:
                type: object
                properties:
                  version: { type: string }
                  changelog: { type: string }
                  published_at: { type: string, format: date-time }

    Subscription:
      type: object
      required: [id, listing, subscribed_version, created_at]
      properties:
        id: { type: string }
        listing: { $ref: '#/components/schemas/ListingSummary' }
        subscribed_version:
          type: string
          description: 订阅时绑定的版本（快照隔离），不随作者发新版而变
        local_alias:
          type: [string, 'null']
          description: 订阅者可在自己空间内重命名
        latest_version:
          type: [string, 'null']
          description: 作者当前最新版本；与 subscribed_version 不同则前端提示"有新版本"
        latest_changelog:
          type: [string, 'null']
          description: 最新版本的更新说明，供订阅者判断是否升级
        created_at: { type: string, format: date-time }

    UsageSummary:
      type: object
      required: [period, total_tokens, total_cost_usd, breakdown]
      properties:
        period: { type: string, examples: ['2026-08'] }
        total_tokens: { type: integer, format: int64 }
        total_cost_usd: { type: number }
        run_count: { type: integer }
        breakdown:
          type: array
          description: 按 bundle 或按天的分组明细
          items:
            type: object
            properties:
              key: { type: string, description: 'bundle_ref 或日期' }
              tokens: { type: integer, format: int64 }
              cost_usd: { type: number }
              run_count: { type: integer }

    AuditLog:
      type: object
      required: [id, action, target_type, target_id, created_at]
      properties:
        id: { type: string }
        action: { type: string, examples: ['human_gate.approved'] }
        target_type: { type: string, examples: ['human_gate'] }
        target_id: { type: string }
        detail: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }

    Report:
      type: object
      required: [id, listing_ref, reason, status, created_at]
      properties:
        id: { type: string }
        listing_ref: { type: string }
        reason: { type: string }
        subscriber_count:
          type: integer
          description: 被举报 listing 的存量订阅者数量，供下架确认弹窗展示影响范围
        status: { type: string, enum: [pending, resolved] }
        resolution: { type: [string, 'null'], enum: [dismiss, takedown, null] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    ModelProvider:
      type: object
      required: [id, provider, status, created_at]
      properties:
        id: { type: string }
        provider: { $ref: '#/components/schemas/ProviderName' }
        base_url: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }

    ModelAccess:
      type: object
      description: >-
        当前账号实际能跑起来的 Provider 集合——个人接入的，加上管理员配置的统一凭证。
        运行前置检查用的就是这一份，所以 UI 的"能不能发起运行"判断读它而不是
        /model-providers。只有名字，没有任何凭证内容。
      required: [providers, has_provider]
      properties:
        providers:
          type: array
          items: { type: string }
          examples: [['deepseek', 'anthropic']]
        has_provider:
          type: boolean
          description: providers 是否非空，前端 gating 直接读这个

    ModelCatalogEntry:
      type: object
      description: >-
        一条模型广场展示行，来自系统配置 → 模型提供商里管理员登记的 Provider + Model
        联合读取；provider 是该 Provider 的 key（自由文本），不是 ProviderName 那个
        为已接入凭证准备的封闭枚举。
      required: [provider, provider_display_name, model, display_name, description, modality, featured]
      properties:
        provider: { type: string, examples: ['deepseek'] }
        provider_display_name: { type: string, examples: ['DeepSeek'] }
        provider_icon: { type: string, description: 'lobehub 图标名（如 kimi、zhipu）、http(s) URL 或 data: URI' }
        provider_template: { type: string, description: '建这个 Provider 用的协议模板名；icon 为空时前端拿它当图标名兜底' }
        model: { type: string, examples: ['deepseek-v3'] }
        display_name: { type: string }
        description: { type: string }
        modality: { $ref: '#/components/schemas/CatalogModality' }
        featured: { type: boolean }

    CatalogModality:
      type: string
      description: 模型广场按此筛选的"模型类型"标签
      enum: [text, image, video, vision, embedding]

    CatalogProvider:
      type: object
      description: 系统配置 → 模型提供商登记的一个 Provider（不是已接入的凭证）
      required: [id, key, display_name, status, created_at, has_credential]
      properties:
        id: { type: string }
        key: { type: string, examples: ['deepseek'] }
        display_name: { type: string, examples: ['DeepSeek'] }
        icon: { type: string, description: 'lobehub 图标名（如 kimi、zhipu）、http(s) URL 或 data: URI' }
        base_url: { type: string }
        template:
          type: string
          description: 从哪个协议模板建出来的，仅供展示；实际行为由落库的描述符快照决定
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        has_credential:
          type: boolean
          description: 是否已登记管理员统一凭证（api_key 永不通过接口返回，只有这个布尔标记）
        request_params:
          type: array
          description: 从落库的描述符快照解析出的模型级参数声明，添加/编辑模型表单按它渲染
          items: { $ref: '#/components/schemas/ModelRequestParam' }

    CatalogModel:
      type: object
      required: [id, provider_id, model, display_name, modality, featured, status, created_at]
      properties:
        id: { type: string }
        provider_id: { type: string }
        model: { type: string, examples: ['deepseek-v3'] }
        display_name: { type: string }
        description: { type: string }
        modality: { $ref: '#/components/schemas/CatalogModality' }
        featured: { type: boolean }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        params:
          type: object
          description: 模型级请求参数的取值（形状见所属提供商的 request_params），调用时注入
          additionalProperties: { type: number }

    # ── 用户管理 / 角色权限（RBAC）──
    Permission:
      type: object
      description: 一个按钮/操作对应的固定权限，由迁移脚本预置，不能通过接口创建
      required: [key, name, module]
      properties:
        key: { type: string, examples: ['model_catalog.provider.create'] }
        name: { type: string, examples: ['新增模型 Provider'] }
        module: { type: string, examples: ['model_catalog'] }

    Role:
      type: object
      required: [id, key, name, description, permission_keys, created_at]
      properties:
        id: { type: string }
        key: { type: string, examples: ['operator'] }
        name: { type: string, examples: ['运营'] }
        description: { type: string }
        permission_keys:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    UserAccount:
      type: object
      description: 系统配置 → 用户管理列表里的一行；不包含密码哈希
      required: [id, email, display_name, status, is_admin, role_keys, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        is_admin:
          type: boolean
          description: 超级管理员，绕过所有权限检查
        role_keys:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    KnowledgeBaseDocument:
      type: object
      required: [source_ref, chunk_count, ingested_at]
      properties:
        source_ref: { type: string }
        chunk_count: { type: integer }
        ingested_at: { type: string, format: date-time }

    KnowledgeBaseSearchResult:
      type: object
      required: [source_ref, content, score]
      properties:
        source_ref: { type: string }
        content: { type: string }
        score:
          type: number
          description: 1 - 余弦距离，越大越相关

    # ── 插件体系（spec-20）──
    Plugin:
      type: object
      description: 一个插件包的一个版本；上传即建版本，visibility=private 时无需审核即可自己安装/试用
      required: [id, plugin_id, version, manifest, visibility, review_status, status, created_at]
      properties:
        id: { type: string }
        plugin_id: { type: string, examples: ['acme.charts'] }
        version: { type: string, examples: ['1.0.0'] }
        display_name: { type: string }
        manifest:
          type: object
          description: plugin.json 原文（schemas/plugin.schema.json 校验过的）
        visibility: { type: string, enum: [private, public] }
        review_status: { type: string, enum: [pending, passed, rejected] }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }

    PluginInstallation:
      type: object
      required: [plugin_id, version, resolution, config, granted, status, created_at]
      properties:
        plugin_id: { type: string }
        version:
          type: string
          description: 安装时锁定的版本
        resolution:
          type: string
          enum: [pinned, live]
          description: pinned（默认，P1 唯一支持）在运行开始时解析一次；live 预留给 P7
        config:
          type: object
          description: >-
            插件自己的配置，凭证字段永不出现在响应里（同资源中心的 Redact 约定）。
            更新时采取"凭证保留"的合并语义：这份 config 原样交回 PATCH 不会把已存的
            密钥清空；要换就给新值，要清除就显式给空串。
        credential_keys:
          type: array
          items: { type: string }
          description: >-
            这次安装填了哪几个凭证字段的**名字**，值一概不返回。装完之后"查看/更换
            密钥"的界面据此渲染输入框。
        granted:
          type: array
          items: { type: string }
          description: 实际授予的 requires.permissions 子集
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }

    InstalledPluginTool:
      type: object
      required: [ref, plugin_id, tool_name]
      properties:
        ref: { type: string, example: 'plugin:agentic-kit.postgres-connector/run_query' }
        plugin_id: { type: string }
        plugin_display_name:
          type: string
          description: manifest.display_name（中文展示名）
        tool_name: { type: string }
        description: { type: string }

    # ── Skill 源 ────────────────────────────────────────────────────
    SkillSource:
      type: object
      required: [id, name, base_url, status, skill_count]
      properties:
        id: { type: string }
        name: { type: string }
        base_url:
          type: string
          description: 站点根地址，不带路径与尾斜杠
        status: { $ref: '#/components/schemas/Status' }
        last_synced_at:
          type: [string, 'null']
          format: date-time
          description: 上次同步时间；null = 从未同步
        last_sync_error:
          type: [string, 'null']
          description: 非空 = 上次同步失败，直接展示给管理员
        skill_count:
          type: integer
          format: int64
          description: 当前缓存条目数

    MarketSkill:
      type: object
      required: [source_id, source_name, source_base_url, slug, name, topics, stars, downloads]
      properties:
        source_id: { type: string }
        source_name: { type: string }
        source_base_url: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        version: { type: string }
        license: { type: string }
        icon_url:
          type: string
          description: >-
            上游给的图标地址；多数条目没有，为空是常态。前端为空时按 slug 生成
            字母图标兜底，所以卡片不会出现空白。
        topics:
          type: array
          items: { type: string }
        stars: { type: integer, format: int64 }
        downloads: { type: integer, format: int64 }
        updated_at:
          type: [string, 'null']
          format: date-time
        review_status:
          $ref: '#/components/schemas/SkillReviewStatus'
        review_note: { type: string }
        reviewed_at: { type: string, format: date-time }
        synced_at: { type: string, format: date-time }

    SkillReviewStatus:
      type: string
      description: >-
        同步条目的本地审核结论。同步进来默认 pending，只有 approved 才会出现在
        Skill 管理的市场视图里、也才允许安装——公开源里混着大量低质量条目，
        默认放行等于没有门槛。审核结论不会被后续同步重置。
      enum: [pending, approved, rejected]

    MarketSkillOwner:
      type: object
      required: [handle]
      properties:
        handle: { type: string, example: 'mattpocock' }
        display_name: { type: string }
        avatar: { type: string, format: uri }

    MarketSkillVersion:
      type: object
      required: [version]
      properties:
        version: { type: string }
        changelog: { type: string }
        created_at: { type: string }

    MarketSkillDetail:
      type: object
      required: [source_id, source_name, source_base_url, slug, name, topics, stars, downloads, versions]
      allOf:
        - $ref: '#/components/schemas/MarketSkill'
        - type: object
          properties:
            usage:
              type: string
              description: 上游 SKILL.md 原文（Markdown），详情页直接渲染
            owner: { $ref: '#/components/schemas/MarketSkillOwner' }
            upstream_url:
              type: string
              description: 上网页面地址，供外链"去源站查看"
            versions:
              type: array
              items: { $ref: '#/components/schemas/MarketSkillVersion' }
    # ── MCP 源 ──────────────────────────────────────────────────────
    MCPSourceProtocolID:
      type: string
      description: >-
        源协议。mcp-registry 是官方注册中心的公开规范，各家子注册中心与自建注
        册中心实现的是同一套，靠 api_prefix 区分版本；smithery 自成一套且要
        API Key；static-json 指向一个返回 server.json 清单的地址，用于没有公
        开列表接口的来源（国内几家广场都属于此类）和内部自研清单。
      enum: [mcp-registry, smithery, static-json]

    MCPSourceProtocol:
      type: object
      required: [id, label, requires_api_key]
      properties:
        id: { $ref: '#/components/schemas/MCPSourceProtocolID' }
        label: { type: string }
        description: { type: string }
        default_base_url:
          type: string
          description: 该协议的公认站点；为空表示得管理员自己填
        default_api_prefix:
          type: string
          description: 该协议的默认接口版本前缀
          example: '/v0'
        requires_api_key:
          type: boolean
          description: 为真时登记该源必须给 API Key
        docs_url:
          type: string
          description: 对方的接口文档，供管理员核对地址与版本前缀

    MCPSource:
      type: object
      required: [id, name, base_url, protocol, has_api_key, status, server_count]
      properties:
        id: { type: string }
        name: { type: string }
        base_url:
          type: string
          description: 注册中心根地址，不带路径与尾斜杠
        protocol: { $ref: '#/components/schemas/MCPSourceProtocolID' }
        api_prefix:
          type: string
          description: 接口版本前缀，实际请求 base_url + api_prefix + /servers
        has_api_key:
          type: boolean
          description: >-
            该源是否已配置 API Key。密钥本身加密落库，任何响应都不带出来。
        status: { $ref: '#/components/schemas/Status' }
        last_synced_at:
          type: [string, 'null']
          format: date-time
          description: 上次同步时间；null = 从未同步
        last_sync_error:
          type: [string, 'null']
          description: 非空 = 上次同步失败，直接展示给管理员
        server_count:
          type: integer
          format: int64
          description: 当前缓存条目数

    MarketMCPServer:
      type: object
      required: [id, source_id, source_name, source_base_url, slug, name, topics, installable]
      properties:
        id: { type: string }
        source_id: { type: string }
        source_name: { type: string }
        source_base_url: { type: string }
        slug:
          type: string
          description: 上游限定名，如 io.github.owner/airtable-mcp-server
          example: 'io.github.domdomegg/airtable-mcp-server'
        name: { type: string }
        summary: { type: string }
        version: { type: string }
        license: { type: string }
        repository_url: { type: string }
        icon_url:
          type: string
          description: >-
            上游给的图标地址；多数条目没有，为空是常态。前端为空时按 slug 生成
            字母图标兜底，所以卡片不会出现空白。
        remote_url:
          type: string
          description: 远端 MCP 地址；空 = 上游只给了本地运行包，平台接入不了
        remote_type:
          type: string
          description: 远端传输方式
          enum: [streamable-http, sse]
        topics:
          type: array
          items: { type: string }
        installable:
          type: boolean
          description: >-
            能不能一键接入。等价于 remote_url 非空——这条规则的出处只在后端，
            前端直接用这个字段，不要自己再判一遍。
        updated_at:
          type: [string, 'null']
          format: date-time
        review_status:
          $ref: '#/components/schemas/SkillReviewStatus'
        review_note: { type: string }
        reviewed_at: { type: string, format: date-time }
        synced_at: { type: string, format: date-time }
