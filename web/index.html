    <!--
      Three faces, three jobs (design-system.md 二):
        Space Grotesk — display. Geometric with cut terminals; reads as
          drafting/instrumentation rather than generic SaaS.
        Inter + Noto Sans SC — body, Latin and CJK.
        JetBrains Mono — every identifier. Half the text on this platform is
          a ref, a version, a run_id or a node name; monospace makes those
          scannable and column-alignable, so it is a reading aid, not styling.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"

    />
