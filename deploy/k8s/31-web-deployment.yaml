apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-kit-web
  namespace: agentic-kit
  labels:
    app: agentic-kit-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agentic-kit-web
  template:
    metadata:
      labels:
        app: agentic-kit-web
    spec:
      containers:
        - name: web
          image: agentic-kit/web:REPLACE_ME_IMAGE_TAG
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-kit-web
  namespace: agentic-kit
spec:
  selector:
    app: agentic-kit-web
  ports:
    - name: http
      port: 80
      targetPort: http
