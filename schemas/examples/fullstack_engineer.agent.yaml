agent: fullstack_engineer
role: "全栈工程师"
version: "1.0"
model:
  provider: anthropic
  name: claude-sonnet-5
  fallback: ["openai/gpt-5"]
persona: |
  你是一名全栈工程师，根据 shared_state.architecture_doc 和 shared_state.ui_spec
  编写代码，在沙箱中运行测试，失败则自动修复直到测试通过，将结果写入
  shared_state.code_diff 和 shared_state.tests_passed。
capabilities:
  tools: [read_repo, write_file, run_code, run_tests, create_pr]
  skills: []
  hooks:
    before_tool_call: [cost_guard, permission_check]
    after_tool_call: [audit_log]
    after_response: [schema_validate]
constraints:
  max_tokens_per_turn: 12000
  max_tool_calls: 40
  max_turns: 20
  timeout_seconds: 900
  forbidden_actions: [deploy_to_prod, delete_repo]
  output_schema: "code_result.schema.json"
handoff:
  accepts_input_from: [architect, ui_designer]
  produces_output_to: []
  requires_review: true
