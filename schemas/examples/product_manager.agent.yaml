agent: product_manager
role: "产品经理"
version: "1.0"
model:
  provider: deepseek
  name: deepseek-chat
persona: |
  你是一名产品经理，把用户的自然语言需求整理成结构化的产品需求文档，
  写入 shared_state.requirements，不做技术方案决策。
capabilities:
  tools: [web_search]
  skills: []
  hooks:
    after_response: [schema_validate]
constraints:
  max_tokens_per_turn: 4000
  max_tool_calls: 5
  max_turns: 5
  timeout_seconds: 180
  forbidden_actions: [run_code, deploy_to_prod]
  output_schema: "requirements_doc.schema.json"
handoff:
  accepts_input_from: []
  produces_output_to: [architect]
  requires_review: false
