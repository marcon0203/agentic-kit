services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_USER: agentic_kit
      POSTGRES_PASSWORD: agentic_kit
      POSTGRES_DB: agentic_kit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_kit"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentic_kit:agentic_kit@postgres:5432/agentic_kit?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
