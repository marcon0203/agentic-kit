services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_USER: agentic_kit
      POSTGRES_PASSWORD: agentic_kit
      POSTGRES_DB: agentic_kit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_kit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 知识库 (optional — profile "kb") ────────────────────────────────
  # Milvus (vector search) + Elasticsearch (keyword search, the second leg
  # of 多路召回). Neither starts with a plain `docker compose up` — the
  # feature is opt-in via KB_ENABLED in .env, so the containers that back
  # it are opt-in too: `docker compose --profile kb up`. etcd + minio are
  # Milvus's own required dependencies for metadata and object storage
  # (the standard shape of a Milvus "standalone" deployment), not
  # something agentic-kit talks to directly.
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["kb"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["kb"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.5
    profiles: ["kb"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: ["kb"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentic_kit:agentic_kit@postgres:5432/agentic_kit?sslmode=disable
      # Only relevant when KB_ENABLED=true (in .env) and the "kb" profile
      # is up — these hostnames only resolve on this Compose network then.
      MILVUS_ADDR: milvus:19530
      ELASTICSEARCH_ADDR: http://elasticsearch:9200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  elasticsearch_data:
